name: Tests

# Runs on pull requests and on demand, so a fork only spends its Actions budget
# on work that is about to be merged.
on:
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    name: Core suite (.NET 8, headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run the core suite
        run: dotnet run --project tests~/Pollinations.Core.Tests

  unity-compile:
    name: Compile the package (against stubs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Compile the Unity facing code
        run: dotnet build tests~/Pollinations.Unity.Compile
